name: Trigger auto deployment for tripwalaah-location

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/tripwalaah-location-AutoDeployTrigger-0c782abf-1b60-49b5-903f-5f42d5e1b2a2.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TRIPWALAAHLOCATION_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TRIPWALAAHLOCATION_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TRIPWALAAHLOCATION_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.TRIPWALAAHLOCATION_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.TRIPWALAAHLOCATION_REGISTRY_PASSWORD }}
          containerAppName: tripwalaah-location
          resourceGroup: tripwalaah-location-microservice
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


