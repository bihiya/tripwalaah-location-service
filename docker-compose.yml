services:
  location-api:
    build: .
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      PORT: 5000
      API_PREFIX: /api
      APP_NAME: Tripwalaah
      MONGODB_URI: mongodb://mongo:27017/tripwalaah
      DB_MAX_POOL_SIZE: 10
      DB_MIN_POOL_SIZE: 2
      DB_CONNECT_TIMEOUT: 30000
      DB_SOCKET_TIMEOUT: 45000
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      FRONTEND_URL: http://localhost:5173
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - location_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  location_mongo_data:
