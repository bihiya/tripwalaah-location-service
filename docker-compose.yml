services:
  location-api:
    build: .
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      PORT: 5000
      API_PREFIX: /api
      APP_NAME: Tripwalaah
      MONGODB_URI: mongodb://mongo:27017/tripwalaah
      DB_MAX_POOL_SIZE: 10
      DB_MIN_POOL_SIZE: 2
      DB_CONNECT_TIMEOUT: 30000
      DB_SOCKET_TIMEOUT: 45000
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      REDIS_LIVE_LOCATION_TTL_SECONDS: 900
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ENABLE_CONSUMER: "false"
      KAFKA_LIVE_LOCATION_TOPIC: tripwalaah.trip.live-location
      KAFKA_TRIP_EVENTS_TOPIC: tripwalaah.trip.events
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      FRONTEND_URL: http://localhost:5173
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - location_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - location_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnami/kafka:3.9
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - location_kafka_data:/bitnami/kafka

volumes:
  location_mongo_data:
  location_redis_data:
  location_kafka_data:
